<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE THING — Title Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas {
    display: block;
    cursor: default;
  }
  #controls {
    position: fixed;
    bottom: 28px;
    display: flex;
    gap: 14px;
    z-index: 10;
  }
  #controls button {
    background: transparent;
    color: #888;
    border: 1px solid #444;
    padding: 8px 28px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #controls button:hover {
    color: #e8c46a;
    border-color: #e8c46a;
    box-shadow: 0 0 12px rgba(232,196,106,0.15);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <button id="btnPlay">Play</button>
  <button id="btnReset">Reset</button>
</div>
<script>
(() => {
  // ─── Canvas Setup ──────────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, fontSize, textY;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    fontSize = Math.min(W * 0.14, H * 0.22);
    textY = cy + fontSize * 0.07;
    buildMask();
    generateCracks();
  }
  window.addEventListener('resize', resize);

  // ─── Offscreen text mask ───────────────────────────────────
  let maskCanvas, maskCtx;
  function buildMask() {
    maskCanvas = document.createElement('canvas');
    maskCanvas.width = W;
    maskCanvas.height = H;
    maskCtx = maskCanvas.getContext('2d');
    maskCtx.clearRect(0, 0, W, H);
    maskCtx.fillStyle = '#fff';
    maskCtx.font = `900 ${fontSize}px "Arial Black", "Impact", sans-serif`;
    maskCtx.textAlign = 'center';
    maskCtx.textBaseline = 'middle';
    maskCtx.fillText('THE THING', cx, textY);
  }

  // ─── Cracks / Tear Lines ───────────────────────────────────
  let cracks = [];
  function generateCracks() {
    cracks = [];
    const letterPositions = [];
    const text = 'THE THING';
    // Estimate letter centers
    const tempCtx = maskCtx;
    tempCtx.font = `900 ${fontSize}px "Arial Black", "Impact", sans-serif`;
    const totalW = tempCtx.measureText(text).width;
    let startX = cx - totalW / 2;
    for (let i = 0; i < text.length; i++) {
      const charW = tempCtx.measureText(text[i]).width;
      if (text[i] !== ' ') {
        letterPositions.push({ x: startX + charW / 2, y: textY });
      }
      startX += charW;
    }

    // Generate branching cracks from each letter
    for (let li = 0; li < letterPositions.length; li++) {
      const origin = letterPositions[li];
      const numBranches = 3 + Math.floor(Math.random() * 4);
      const revealBase = 0.08 + (li / letterPositions.length) * 0.35;

      for (let b = 0; b < numBranches; b++) {
        const segments = [];
        let angle = Math.random() * Math.PI * 2;
        let px = origin.x + (Math.random() - 0.5) * fontSize * 0.3;
        let py = origin.y + (Math.random() - 0.5) * fontSize * 0.4;
        const segCount = 8 + Math.floor(Math.random() * 14);
        for (let s = 0; s < segCount; s++) {
          const len = 4 + Math.random() * 18;
          angle += (Math.random() - 0.5) * 1.2;
          const nx = px + Math.cos(angle) * len;
          const ny = py + Math.sin(angle) * len;
          segments.push({
            x1: px, y1: py, x2: nx, y2: ny,
            revealAt: revealBase + (s / segCount) * 0.3 + Math.random() * 0.05
          });
          px = nx;
          py = ny;
        }
        cracks.push(segments);
      }
    }
  }

  // ─── Particles (Sparks / Embers) ──────────────────────────
  let particles = [];

  function spawnParticles(progress) {
    if (progress < 0.15 || progress > 0.92) return;
    const count = Math.floor(2 + progress * 4);
    for (let i = 0; i < count; i++) {
      const spread = fontSize * 2.5;
      particles.push({
        x: cx + (Math.random() - 0.5) * spread,
        y: textY + (Math.random() - 0.5) * fontSize * 0.6,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -0.5 - Math.random() * 2.5,
        life: 60 + Math.random() * 80,
        maxLife: 60 + Math.random() * 80,
        size: 1 + Math.random() * 2.5,
        hue: 25 + Math.random() * 30 // orange-yellow
      });
    }
  }

  function updateParticles() {
    for (let p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy -= 0.015; // upward drift (negative = up)
      p.vx *= 0.99;
      p.life--;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ─── Smoke Puffs ──────────────────────────────────────────
  let smokePuffs = [];
  function spawnSmoke(progress) {
    if (progress < 0.1 || progress > 0.88) return;
    if (Math.random() > 0.3) return;
    smokePuffs.push({
      x: cx + (Math.random() - 0.5) * fontSize * 3,
      y: textY + (Math.random() - 0.5) * fontSize * 0.5,
      r: 20 + Math.random() * 40,
      alpha: 0.02 + Math.random() * 0.04,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.3 - Math.random() * 0.6,
      life: 120 + Math.random() * 100,
      maxLife: 120 + Math.random() * 100
    });
  }
  function updateSmoke() {
    for (let s of smokePuffs) {
      s.x += s.vx;
      s.y += s.vy;
      s.r += 0.3;
      s.life--;
    }
    smokePuffs = smokePuffs.filter(s => s.life > 0);
  }

  // ─── Light Rays ────────────────────────────────────────────
  const NUM_RAYS = 18;
  let rays = [];
  function buildRays() {
    rays = [];
    for (let i = 0; i < NUM_RAYS; i++) {
      rays.push({
        angle: (i / NUM_RAYS) * Math.PI * 2,
        width: 0.03 + Math.random() * 0.06,
        length: 0.5 + Math.random() * 0.5,
        brightness: 0.3 + Math.random() * 0.5
      });
    }
  }
  buildRays();

  // ─── Animation State ──────────────────────────────────────
  const TOTAL_FRAMES = 300;
  let t = 0;
  let running = false;
  let rafId = null;

  // ─── RENDER ────────────────────────────────────────────────
  function render() {
    const progress = Math.min(t / 280, 1);

    // Clear to black
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Flicker
    const flicker = 1.0
      + 0.06 * Math.sin(t * 0.37)
      + 0.04 * Math.cos(t * 0.53)
      + 0.03 * Math.sin(t * 1.1)
      + 0.02 * Math.cos(t * 2.3);

    // ── Smoke background layer ─────────────────────────────
    spawnSmoke(progress);
    updateSmoke();
    ctx.globalCompositeOperation = 'lighter';
    for (let s of smokePuffs) {
      const lifeRatio = s.life / s.maxLife;
      const a = s.alpha * lifeRatio * Math.min(progress * 3, 1);
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      grad.addColorStop(0, `rgba(100,80,60,${a})`);
      grad.addColorStop(1, `rgba(60,40,30,0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    }

    // ── Backlight glow INSIDE letters (text mask) ──────────
    if (progress > 0.03) {
      // Build the glow on a temp canvas, then mask it
      const glowCanvas = document.createElement('canvas');
      glowCanvas.width = W;
      glowCanvas.height = H;
      const gCtx = glowCanvas.getContext('2d');

      const intensity = Math.min(progress * 1.8, 1) * flicker;

      // Central bright glow
      const gr1 = gCtx.createRadialGradient(cx, textY, 0, cx, textY, fontSize * 1.2);
      gr1.addColorStop(0, `rgba(255,220,140,${0.9 * intensity})`);
      gr1.addColorStop(0.3, `rgba(255,180,80,${0.5 * intensity})`);
      gr1.addColorStop(0.7, `rgba(200,100,40,${0.2 * intensity})`);
      gr1.addColorStop(1, `rgba(120,50,20,0)`);
      gCtx.fillStyle = gr1;
      gCtx.fillRect(0, 0, W, H);

      // Second pass — hotter core
      if (progress > 0.2) {
        const coreIntensity = Math.min((progress - 0.2) * 2.5, 1) * flicker;
        const gr2 = gCtx.createRadialGradient(cx, textY, 0, cx, textY, fontSize * 0.6);
        gr2.addColorStop(0, `rgba(255,255,220,${0.7 * coreIntensity})`);
        gr2.addColorStop(0.5, `rgba(255,200,120,${0.3 * coreIntensity})`);
        gr2.addColorStop(1, `rgba(200,100,40,0)`);
        gCtx.globalCompositeOperation = 'lighter';
        gCtx.fillStyle = gr2;
        gCtx.fillRect(0, 0, W, H);
      }

      // Clip glow to text shape using source-atop
      gCtx.globalCompositeOperation = 'destination-in';
      gCtx.drawImage(maskCanvas, 0, 0);

      // Draw masked glow onto main canvas
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glowCanvas, 0, 0);

      // ── Subtle outer glow bleeding past letters ────────
      if (progress > 0.15) {
        const outerInt = Math.min((progress - 0.15) * 1.5, 1) * 0.25 * flicker;
        const grOuter = ctx.createRadialGradient(cx, textY, fontSize * 0.3, cx, textY, fontSize * 2);
        grOuter.addColorStop(0, `rgba(255,160,60,${outerInt})`);
        grOuter.addColorStop(0.5, `rgba(200,80,20,${outerInt * 0.4})`);
        grOuter.addColorStop(1, `rgba(100,30,10,0)`);
        ctx.fillStyle = grOuter;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // ── Light Rays ─────────────────────────────────────────
    if (progress > 0.12) {
      const rayProgress = Math.min((progress - 0.12) / 0.5, 1);
      const rayRotation = t * 0.003;
      ctx.globalCompositeOperation = 'screen';
      for (let ray of rays) {
        const angle = ray.angle + rayRotation;
        const maxLen = Math.max(W, H) * ray.length * rayProgress;
        const alpha = ray.brightness * rayProgress * flicker * 0.35;
        if (alpha < 0.01) continue;

        ctx.save();
        ctx.translate(cx, textY);
        ctx.rotate(angle);
        const rayGrad = ctx.createLinearGradient(0, 0, maxLen, 0);
        rayGrad.addColorStop(0, `rgba(255,200,120,${alpha})`);
        rayGrad.addColorStop(0.3, `rgba(255,150,60,${alpha * 0.5})`);
        rayGrad.addColorStop(1, `rgba(200,80,20,0)`);
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        const halfW = Math.tan(ray.width) * maxLen;
        ctx.lineTo(maxLen, -halfW);
        ctx.lineTo(maxLen, halfW);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // ── Cracks / Tear Lines ────────────────────────────────
    ctx.globalCompositeOperation = 'screen';
    for (let branch of cracks) {
      for (let seg of branch) {
        if (progress < seg.revealAt) continue;
        const segAlpha = Math.min((progress - seg.revealAt) * 8, 1) * flicker;
        // bright core
        ctx.strokeStyle = `rgba(255,220,160,${segAlpha * 0.9})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
        ctx.stroke();
        // glow
        ctx.strokeStyle = `rgba(255,140,40,${segAlpha * 0.4})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
        ctx.stroke();
      }
    }

    // ── Particles (Sparks / Embers) ────────────────────────
    spawnParticles(progress);
    updateParticles();
    ctx.globalCompositeOperation = 'lighter';
    for (let p of particles) {
      const lifeRatio = p.life / p.maxLife;
      const a = lifeRatio * flicker;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
      grad.addColorStop(0, `hsla(${p.hue},100%,80%,${a})`);
      grad.addColorStop(0.4, `hsla(${p.hue},100%,50%,${a * 0.5})`);
      grad.addColorStop(1, `hsla(${p.hue},100%,30%,0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(p.x - p.size * 3, p.y - p.size * 3, p.size * 6, p.size * 6);
    }

    // ── Vignette ───────────────────────────────────────────
    ctx.globalCompositeOperation = 'source-over';
    const vigR = Math.max(W, H) * 0.75;
    const vig = ctx.createRadialGradient(cx, cy, vigR * 0.3, cx, cy, vigR);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.6, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // ── Fade to Black ──────────────────────────────────────
    if (progress > 0.85) {
      const fadeAlpha = Math.min((progress - 0.85) / 0.15, 1);
      ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ── Advance frame ──────────────────────────────────────
    if (running) {
      t++;
      if (t >= TOTAL_FRAMES) {
        running = false;
        btnPlay.textContent = 'Play';
      }
      rafId = requestAnimationFrame(render);
    }
  }

  // ─── Controls ──────────────────────────────────────────────
  const btnPlay = document.getElementById('btnPlay');
  const btnReset = document.getElementById('btnReset');

  btnPlay.addEventListener('click', () => {
    if (running) {
      running = false;
      btnPlay.textContent = 'Play';
    } else {
      if (t >= TOTAL_FRAMES) {
        resetState();
      }
      running = true;
      btnPlay.textContent = 'Pause';
      rafId = requestAnimationFrame(render);
    }
  });

  btnReset.addEventListener('click', () => {
    running = false;
    resetState();
    btnPlay.textContent = 'Play';
    render(); // draw the black frame
  });

  function resetState() {
    t = 0;
    particles = [];
    smokePuffs = [];
    generateCracks();
    buildRays();
  }

  // ─── Init ──────────────────────────────────────────────────
  resize();
  render(); // initial black frame
})();
</script>
</body>
</html>
